<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Tug-of-War</title>
    <link rel="stylesheet" href="styles.css">
    <script src="scripts.js" defer></script>
    <audio id="correct-sound" src="sounds/correct.mp3"></audio>
    <audio id="wrong-sound" src="sounds/wrong.mp3"></audio>
</head>
<body>
    <header>
        <h1>Math Tug-of-War</h1>
        <div id="scoreboard">
            <span>Player 1: <span id="player1-score">0</span></span>
            <span>Player 2: <span id="player2-score">0</span></span>
        </div>
    </header>
    <main>
        <div id="problem-container">
            <h2 id="math-problem">What is 2 + 2?</h2>
            <input type="text" id="user-answer" placeholder="Your answer">
            <button id="submit-answer">Submit</button>
            <div id="animations-container"></div>
        </div>
        <button id="next-problem">Next Problem</button>
    </main>
    <footer>
        <p>© 2026 Math Tug-of-War. All rights reserved.</p>
    </footer>
</body>
</html>

<script>
const problems = [
    { question: 'What is 2 + 2?', answer: 4 },
    { question: 'What is 5 * 6?', answer: 30 },
    { question: 'What is 15 - 7?', answer: 8 },
    { question: 'What is 9 / 3?', answer: 3 },
    { question: 'What is 12 + 8?', answer: 20 }
];

let currentProblemIndex = 0;
const player1Score = document.getElementById('player1-score');
const player2Score = document.getElementById('player2-score');
const mathProblem = document.getElementById('math-problem');
const userAnswer = document.getElementById('user-answer');
const submitAnswer = document.getElementById('submit-answer');

function loadProblem() {
    const problem = problems[currentProblemIndex];
    mathProblem.textContent = problem.question;
    userAnswer.value = '';
}

function checkAnswer() {
    const problem = problems[currentProblemIndex];
    const correctSound = document.getElementById('correct-sound');
    const wrongSound = document.getElementById('wrong-sound');

    if (parseInt(userAnswer.value) === problem.answer) {
        currentPlayerScore();
        correctSound.play();
    } else {
        wrongSound.play();
    }
    currentProblemIndex++;
    if (currentProblemIndex >= problems.length) currentProblemIndex = 0;
    loadProblem();
}

function currentPlayerScore() {
    // Logic to update player score
    player1Score.textContent = parseInt(player1Score.textContent) + 1;  
}

submitAnswer.addEventListener('click', checkAnswer);
loadProblem();
</script>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f9f9f9;
    color: #333;
    transition: background-color 0.5s;
}

header, footer {
    text-align: center;
    padding: 20px;
    background-color: #4CAF50;
    color: white;
}

main {
    margin: 20px;
}

#problem-container {
    margin: auto;
    padding: 10px;
    background-color: white;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}

#submit-answer {
    background-color: #008CBA;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

#submit-answer:hover {
    background-color: #005f7f;
}
</style>
