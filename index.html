<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Tug-of-War Mega</title>
<style>
body { text-align: center; font-family: Arial, sans-serif; background: #e0f7fa; margin:0; }
#game-container { max-width: 600px; margin: auto; padding: 20px; }
h2 { margin-top: 20px; }
#rope-area { position: relative; height: 100px; margin: 30px 0; background: #8bc34a; border-radius: 15px; display: flex; align-items: center; overflow: hidden; }
#rope { width: 100%; height: 10px; background: #795548; position: relative; }
#flag { position: absolute; top: -20px; left: 50%; font-size: 40px; transform: translateX(-50%); transition: 0.5s; }
#question { font-size: 32px; color: #0288d1; margin: 20px 0; }
.buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
button { padding: 15px; font-size: 24px; border: none; border-radius: 10px; background: #ff9800; color: white; cursor: pointer; }
button:active { transform: scale(0.95); background: #f57c00; }
#message { font-size: 20px; font-weight: bold; height: 30px; margin-top: 10px; }
#score { font-size: 18px; margin-top: 5px; color: #2e7d32; }
</style>
</head>
<body>

<div id="game-container">
<h2>🤖 ROBOT vs DINO 🦖</h2>
<div id="score">Score: 0</div>
<div id="rope-area">
<div id="rope"><div id="flag">🚩</div></div>
</div>
<div id="question">Loading...</div>
<div class="buttons" id="btn-container"></div>
<div id="message"></div>
</div>

<script>
let pos = 50;
let score = 0;
let currentAns = 0;

// Generate random math question
function generateQuestion() {
    const operations = ['+', '-', '*', '/'];
    const op = operations[Math.floor(Math.random() * operations.length)];
    let n1 = Math.floor(Math.random() * 50) + 1;
    let n2 = Math.floor(Math.random() * 50) + 1;

    if (op === '/') n1 = n1 * n2; // Ensure integer division

    switch(op) {
        case '+': currentAns = n1 + n2; break;
        case '-': currentAns = n1 - n2; break;
        case '*': currentAns = n1 * n2; break;
        case '/': currentAns = n1 / n2; break;
    }

    document.getElementById("question").innerText = `${n1} ${op} ${n2} = ?`;

    // create buttons
    const btns = [currentAns, currentAns + 1, currentAns - 1, currentAns + 2].sort(() => Math.random() - 0.5);
    const container = document.getElementById("btn-container");
    container.innerHTML = '';
    btns.forEach(num => {
        const btn = document.createElement("button");
        btn.innerText = num;
        btn.onclick = () => check(num);
        container.appendChild(btn);
    });
}

function check(num) {
    const flag = document.getElementById("flag");
    const msg = document.getElementById("message");

    if (num === currentAns) {
        pos -= 10;
        score++;
        msg.innerText = "Sahihi! 🤖";
        msg.style.color = "blue";
    } else {
        pos += 10;
        score = Math.max(0, score - 1);
        msg.innerText = "Si sahihi! 🦖";
        msg.style.color = "red";
    }

    document.getElementById("score").innerText = `Score: ${score}`;
    flag.style.left = pos + "%";

    if (pos <= 10) { alert("ROBOT AMESHINDA! 🤖🏆"); reset(); }
    else if (pos >= 90) { alert("DINO AMESHINDA! 🦖🏆"); reset(); }
    else { setTimeout(generateQuestion, 700); }
}

function reset() {
    pos = 50;
    score = 0;
    document.getElementById("flag").style.left = "50%";
    document.getElementById("score").innerText = "Score: 0";
    generateQuestion();
}

generateQuestion();
</script>

</body>
</html>
